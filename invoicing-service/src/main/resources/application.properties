spring.application.name=invoicing-service
server.port=8082
spring.grpc.server.port=9092
spring.grpc.server.reflection.enabled=true
spring.grpc.server.security.enabled=false
spring.grpc.server.security.certificate-chain=
spring.grpc.server.security.private-key=
spring.datasource.url=jdbc:postgresql://localhost:5432/billing
spring.datasource.username=billing
spring.datasource.password=billing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
